# Portfólio — acesso pelo IP do servidor (HTTP).
# farmcloudmc.com e os outros server_name continuam intactos.
# Só o Host que não casa com nenhum domínio (ex.: http://178.105.63.20) cai aqui.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 178.105.63.20 _;

    root /var/www/henrique-erdei-portfolio;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
