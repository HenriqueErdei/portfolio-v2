# Portfólio — acesso pelo IP do servidor (HTTP).
# farmcloudmc.com e os outros server_name continuam intactos.
# Só o Host que não casa com nenhum domínio (ex.: http://178.105.63.20) cai aqui.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 178.105.63.20 _;

    root /var/www/henrique-erdei-portfolio;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fall-detect/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 500m;
        sub_filter_once off;
        sub_filter 'src="/video_feed"' 'src="/fall-detect/video_feed"';
        sub_filter "fetch('/source'" "fetch('/fall-detect/source'";
        sub_filter "fetch('/stats'" "fetch('/fall-detect/stats'";
    }

    location /epi-detect/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        sub_filter_once off;
        sub_filter 'src="/video_feed"' 'src="/epi-detect/video_feed"';
        sub_filter "fetch('/source'" "fetch('/epi-detect/source'";
        sub_filter "fetch('/stats'" "fetch('/epi-detect/stats'";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
