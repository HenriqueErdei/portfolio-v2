<!doctype html>
<html lang="pt-BR" data-theme="console">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- TODO: troque example.com pelo seu domínio nas quatro URLs abaixo e em
         public/robots.txt. Enquanto não tiver domínio, use a URL que a Netlify
         ou a Vercel gerar. -->
    <link rel="canonical" href="https://example.com/" />

    <title>Henrique Erdei — Engenheiro Full-Stack &amp; Especialista em Dados</title>
    <meta
      name="description"
      content="Portfólio de Henrique Erdei, engenheiro full-stack e especialista em dados em São Paulo. Sistemas de BI em Python e Flask, painéis em Power BI e interfaces em React."
    />
    <meta name="author" content="Henrique Erdei" />
    <meta name="theme-color" content="#04060e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Henrique Erdei" />
    <meta property="og:title" content="Henrique Erdei — Engenheiro Full-Stack &amp; Especialista em Dados" />
    <meta
      property="og:description"
      content="Eu transformo dado bruto em decisão. Sistemas de BI, painéis e interfaces — role para ver o trabalho."
    />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://example.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Henrique Erdei",
        "url": "https://example.com/",
        "jobTitle": "Full-Stack Engineer & Data Specialist",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "São Paulo",
          "addressCountry": "BR"
        },
        "knowsAbout": ["Python", "Flask", "Power BI", "React", "TypeScript", "SQL"],
        "sameAs": ["https://github.com/HenriqueErdei"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Este portfólio usa JavaScript para a animação de fundo. O conteúdo completo também está em
        <a href="https://github.com/HenriqueErdei">github.com/HenriqueErdei</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
