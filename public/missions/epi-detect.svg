    <text x="866" y="265" fill="#4F8CFF" font-size="18" font-weight="850">03</text>
    <text x="866" y="305" fill="#F8FAFC" font-size="26" font-weight="850">HSV no torso.</text>
    <text x="866" y="336" fill="#94A3B8" font-size="16">Área, lados e span.</text>

    <line x1="1105" y1="287" x2="1190" y2="287" stroke="#4F8CFF" stroke-width="4" marker-end="url(#arrow-epi)"/>

