    <text x="486" y="265" fill="#4F8CFF" font-size="18" font-weight="850">02</text>
    <text x="486" y="305" fill="#F8FAFC" font-size="26" font-weight="850">YOLO Pose.</text>
    <text x="486" y="336" fill="#94A3B8" font-size="16">Pessoa e keypoints.</text>

    <line x1="725" y1="287" x2="810" y2="287" stroke="#4F8CFF" stroke-width="4" marker-end="url(#arrow-epi)"/>

