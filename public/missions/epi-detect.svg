    <text x="1246" y="305" fill="#F8FAFC" font-size="26" font-weight="850">Dashboard web.</text>
    <text x="1246" y="336" fill="#94A3B8" font-size="16">MJPEG, conformidade e alertas.</text>

    <line x1="588" y1="362" x2="588" y2="422" stroke="#F08C2A" stroke-width="3"/>
    <line x1="968" y1="362" x2="968" y2="422" stroke="#F08C2A" stroke-width="3"/>

